[project]
name = "mc-option-pricing"
version = "0.1.0"
description = "Variance reduction for Monte Carlo option pricing"
readme = "README.md"
authors = [
    { name = "Tommaso Lorenzon", email = "tommaso.lorenzon@proton.me" }
]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "scipy>=1.18.0",
]


[tool.uv.build-backend]
module-name = "mcpricer"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
    "pytest>=9.1.1",
    "scipy-stubs>=1.18.1.1",
]
